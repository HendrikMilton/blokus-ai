apiVersion: apps/v1
kind: Deployment
metadata:
  name: blokus-ai-api
  labels:
    app: blokus-ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blokus-ai-api
  template:
    metadata:
      labels:
        app: blokus-ai-api
    spec:
      containers:
        - name: api
          image: blokus-ai-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blokus-ai-secrets
                  key: DATABASE_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: blokus-ai-config
                  key: FRONTEND_URL
          livenessProbe:
            httpGet:
              path: /ping/liveness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping/readiness
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: blokus-ai-api
spec:
  selector:
    app: blokus-ai-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blokus-ai-config
data:
  FRONTEND_URL: "https://blokus-ai.example.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: blokus-ai-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/blokus-ai"
  # Add other secrets here:
  # TELEGRAM_BOT_TOKEN: ""
  # TELEGRAM_CHAT_ID: ""
